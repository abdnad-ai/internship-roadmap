services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: watchpost
      POSTGRES_USER: watchpost
      POSTGRES_PASSWORD: watchpost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchpost -d watchpost"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./website-monitor-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://watchpost:watchpost@postgres:5432/watchpost?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret}
      JWT_REFRESH_EXPIRES: 7d
      CRON_SECRET: ${CRON_SECRET:-local-demo-cron-secret}
      FRONTEND_URL: http://localhost:3000
      AI_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VERTEX_AI_PROJECT_ID: ${VERTEX_AI_PROJECT_ID:-}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-us-central1}
      VERTEX_AI_SERVICE_ACCOUNT_JSON: ${VERTEX_AI_SERVICE_ACCOUNT_JSON:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./website-monitor-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  demo-target:
    build: ./demo-target
    environment:
      DEMO_SECRET: ${DEMO_SECRET:-local-demo-secret}
    ports:
      - "5050:8080"

volumes:
  postgres_data:
