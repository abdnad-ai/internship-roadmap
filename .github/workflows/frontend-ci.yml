name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "next.js-projects/week-3-task-manager-web/**"
  push:
    branches: [main]
    paths:
      - "next.js-projects/week-3-task-manager-web/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: next.js-projects/week-3-task-manager-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: next.js-projects/week-3-task-manager-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build 